[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-lead-monitor"
version = "0.1.0"
description = "Microservice Telegram lead monitor for trading-bot and quantitative-development prospects"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "redis>=5.2,<7.0",
  "telethon>=1.37,<2.0",
  "pyyaml>=6.0,<7.0",
  "pandas>=2.2,<4.0",
  "openpyxl>=3.1,<4.0",
  "structlog>=24.4,<26.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=3.3,<6.0",
  "torch>=2.4,<3.0",
]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.7,<1.0",
]

[tool.setuptools.packages.find]
include = ["services*", "shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
