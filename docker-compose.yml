services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "services.api.app.main:app", "--host", "0.0.0.0", "--port", "${API_PORT:-8010}"]
    env_file:
      - .env
      - path: .env.validation
        required: false
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:${API_PORT:-8010}:${API_PORT:-8010}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  collector:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "services.collector.app.main"]
    env_file: .env
    volumes:
      - telegram_session:/data/telegram
      - ./config:/app/config:ro
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analyzer:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "services.analyzer.app.main"]
    env_file: .env
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "services.scheduler.app.main"]
    env_file: .env
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  commercial-ai-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "services.commercial_ai.app.main"]
    env_file:
      - .env
      - path: .env.validation
        required: false
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  telegram_session:
