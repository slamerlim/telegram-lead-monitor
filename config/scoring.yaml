    - '\b(?:new\s+listing\s+announcement|listing\s+announcement|trading:\s*opened|coming\s+soon\s+to\b)\b'
    - '\b(?:sign\s+up\s+now|limited[- ]time\s+offer|promo(?:tion)?\s+code|airdrop)\b'
    - '\b(?:trading\s+competition|deposit\s+bonus|referral\s+bonus|welcome\s+bonus)\b'
