patterns:
  # Explicit COMMERCIAL actions. These are the gate for a commercial lead.
  commercial_purchase:
    - '\b(?:i|we)\s+(?:want|would like|am looking|are looking)\s+to\s+(?:buy|purchase)\b.{0,120}\b(?:bot|trading\s+bot|software|system|automation)\b'
    - '\b(?:looking to buy|looking to purchase|want to buy|need to buy|need to purchase)\b.{0,100}\b(?:bot|trading\s+bot|software|system|automation)\b'
    - '\b(?:commission|commissioning)\b.{0,140}\b(?:developer|programmer|engineer|freelancer|contractor)\b.{0,140}\b(?:build|create|develop|make)\b.{0,140}\b(?:bot|trading|system|strategy)\b'
    - '\b(?:looking for|need|want)\b.{0,140}\b(?:someone|developer|programmer|engineer|freelancer)\b.{0,140}\b(?:to\s+)?(?:develop|build|create|make)\b.{0,160}\b(?:(?:telegram|crypto|trading)\s+)?(?:bot|trading\s+system|strategy)\b'
    - '\b(?:купить|хочу купить|ищу где купить)\b.{0,100}\b(?:бот|торгов(?:ый|ая)|система|автоматизац)\w*\b'
    - '\b(?:мне\s+)?нужен\b.{0,80}\b(?:копитрейдинг\s+|торговый\s+|crypto\s+|trading\s+)?бот\b'
    - '\b(?:куплю|закажу|заказать)\b.{0,60}\bбот\b'
    - '\bпрежде чем я куплю\b.{0,80}\bбот\b'

  commercial_repair:
    - '\b(?:need|looking for|want|hiring|hire)\b.{0,160}\b(?:developer|programmer|engineer|freelancer|someone|help)\b.{0,160}\b(?:fix|repair|debug|troubleshoot|diagnose)\b.{0,160}\b(?:bot|trading|api|strategy|system|execution)\b'
    - '\b(?:trading\s+)?bot\b.{0,220}\b(?:need|looking for|want)\b.{0,120}\b(?:developer|programmer|engineer|freelancer|someone)\b.{0,120}\b(?:fix|repair|debug|troubleshoot|diagnose)\b'
    - '\b(?:my|our)\s+(?:trading\s+)?bot\b.{0,100}\b(?:broken|bug|error|issue|problem|fails|failed|not working|doesn\x27t work|stopped)\b.{0,120}\b(?:developer|programmer|engineer|freelancer|someone)\b.{0,80}\b(?:help|fix|repair|debug|diagnose)\b'
    - '\b(?:my|our)\s+(?:trading\s+)?bot\b.{0,100}\b(?:broken|bug|error|issue|problem|fails|failed|not working|doesn\x27t work|stopped)\b.{0,60}\b(?:please\s+)?(?:fix|repair|debug|diagnose)\b'
    - '\b(?:who\s+can|can\s+someone|is\s+there\s+someone)\b.{0,120}\b(?:fix|repair|debug|troubleshoot)\b.{0,120}\b(?:my|our)?\s*(?:trading\s+)?bot\b'
    - '\b(?:нужен|ищу)\s+(?:разработчик|программист|инженер|фрилансер|человек)\b.{0,120}\b(?:починить|исправить|дебаг|доработать|бот|трейдинг|систем)\w*\b'
    - '\b(?:мой|наш|у\s+меня|у\s+нас)\b.{0,120}\b(?:бот|торгов(?:ый|ого)\s+бот)\b.{0,120}\b(?:слом\w*|ошибк\w*|проблем\w*|не\s+работ\w*)\b.{0,120}\b(?:разработчик|программист|инженер|починить|исправить|помогите|помочь)\b'

  commercial_customization:
    - '\b(?:need|looking for|want)\b.{0,100}\b(?:developer|programmer|engineer|freelancer|someone)\b.{0,100}\b(?:customi[sz]e|modify|extend|add)\b.{0,120}\b(?:bot|trading|dca|grid|strategy|system)\b'
    - '\b(?:need|looking for|want)\b.{0,100}\b(?:to\s+)?(?:customi[sz]e|modify|extend)\b.{0,80}\b(?:my|our)\s+(?:dca\s+|grid\s+|trading\s+)?bot\b'
    - '\b(?:нужен|ищу)\s+(?:разработчик|программист|инженер|фрилансер)\b.{0,100}\b(?:доработать|модифицировать|добавить|изменить)\b.{0,100}\b(?:бот|стратег|трейдинг)\w*\b'
    - '\b(?:мой|наш)\b.{0,100}\b(?:бот|торгов(?:ый|ая)\s+систем)\w*\b.{0,100}\b(?:доработать|модифицировать|кастомиз)\w*\b.{0,80}\b(?:разработчик|программист|инженер|нужен|ищу)\b'

  commercial_hire:
    - '\b(?:hire|hiring|looking for|seeking)\b.{0,120}\b(?:developers?|engineers?|programmers?|quant|quantitative|ml engineer|ai engineer|machine learning|freelancers?|contractors?)\b'
    # Require need + role noun adjacently ("need a developer"), not "need … engineer" across a support question.
    - '\bneed(?:\s+to\s+hire|\s+to\s+find)?\s+(?:a|an|the\s+)?(?:developers?|engineers?|programmers?|quant|quantitative|ml engineer|ai engineer|freelancers?|contractors?)\b'
    - '\bwant\s+to\s+(?:hire|buy|commission|engage)\b.{0,120}\b(?:developer|engineer|programmer|quant|freelancer|contractor|bot)\b'
    - '\b(?:on|for a)\s+(?:contract|contractor|freelance|project|fixed[- ]term)\b'
    # Freelance/contract RFQ titles — not "Freelancer of the Week" portfolio ads.
    - '\b(?:freelance|contract)\s+opportunity\b.{0,160}\b(?:developer|engineer|quant|programmer|ml engineer|ai engineer|bot)\b'
    - '\b(?:looking for|need|hiring|hire|seeking)\b.{0,100}\b(?:contractor|freelance|freelancer|project[- ]based|fixed[- ]term|(?<!smart[ -])contract)\b.{0,100}\b(?:developer|engineer|quant|programmer|ml engineer|ai engineer)\b'
    - '\b(?:нанять|ищем|нужен|ищу)\b.{0,100}\b(?:разработчик|программист|инженер|квант|ml|ai)\b.{0,100}\b(?:контракт|фриланс|подряд|на\s+проект)\w*\b'

  commercial_implementation:
    - '\b(?:need|looking for|want|hiring|hire)\b.{0,140}\b(?:developer|programmer|engineer|freelancer|someone)\b.{0,140}\b(?:implement|automate|build|develop|create)\b.{0,160}\b(?:strategy|algorithm|trading strategy|system|trading bot|futures trading|telegram\s+trading\s+bot)\b'
    - '\b(?:i|we)\s+(?:have|created|developed)\s+(?:a\s+)?(?:trading\s+)?strategy\b.{0,200}\b(?:need|looking for|want|hiring)\b.{0,140}\b(?:implement|automate|developer|programmer|engineer)\b'
    - '\b(?:реализовать|внедрить|автоматизировать)\b.{0,100}\b(?:стратеги|торгов|алгоритм)\w*\b.{0,100}\b(?:разработчик|программист|инженер|подрядчик)\b'

  buyer_intent:
    - '\b(?:need|looking for|seeking|want|hire|hiring|commission|purchase|buy|quote|budget|proposal)\b.{0,180}\b(?:developer|engineer|programmer|freelancer|contractor|bot|trading|strategy|quant|ml|ai|system)\b'
    - '\b(?:нужен|ищу|нанять|заказать|купить|бюджет|стоимость|цена|предложение|подрядчик)\b.{0,180}\b(?:разработчик|программист|инженер|бот|трейдинг|стратег|квант|ml|ai|систем)\w*\b'

  contract_engagement:
