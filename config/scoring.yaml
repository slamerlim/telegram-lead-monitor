    - '\bcontractor\b'
    - '\bfreelance\b'
    - '\bfreelancer\b'
    - '\bproject[- ]based\b'
    - '\bfixed[- ]term\b'
    - '\bpart[- ]time\b'
    - '\bconsulting\b'
    - '\bподряд\w*\b'
    - '\bконтракт\w*\b'
    - '\bфриланс\w*\b'
    - '\bпроектн\w*\b'

  service_provider:
    - '\b(?:i|we)\s+(?:can|will)\s+(?:build|develop|fix|create|help|provide|offer)\b'
    - '\b(?:hire me|dm me|contact me|reach out)\b.{0,80}\b(?:build|develop|fix|create|help)\b'
    - '\bgig of the day\b'
    - '\bfreelancer of the week\b'
    - '\bavailable for\s+(?:urgency|work|hire|projects?)\b'
    - '\d+\s*★.{0,80}\b(?:review|reputation)\b'
    - '(?:^|[^\w])\$\d+(?:\.\d+)?\s*/\s*hr\b'
    - '\bhelping startups\b'
    - '\b(?:i(?:''m| am)|я)\s+(?:a\s+)?(?:senior|full[- ]?stack|blockchain|web3)\s+(?:developer|engineer)\b.{0,120}\b(?:specializ|experience|available|portfolio)\b'
    - '\b(?:i|we)\s+(?:develop|build|offer|provide)\b.{0,120}\b(?:bot|trading|web3|solana|crypto)\b'
    - '\b(?:do\s+you\s+need)\s+(?:a\s+)?(?:developer|engineer|programmer)\b.{0,160}\b(?:i(?:''|’)m|i\s+am|we\s+are)\b.{0,80}\b(?:developer|engineer|programmer|full[- ]stack)\b'
    - '\b(?:i(?:''|’)m|i\s+am)\s+a\s+(?:full[- ]stack\s+)?(?:developer|engineer|programmer)\b.{0,120}\b(?:can\s+help|available|dm\s+me|hire\s+me)\b'
    - '\bfeel\s+free\s+to\s+dm\s+me\b'
    - '\bdm\s+me\s+for\s+(?:your|a)\s+project\b'
    - '\bhire\s+me\b'
    - '\bavailable\s+for\s+(?:work|projects|hire)\b'
    - '\byour\s+project\b.{0,40}\b(?:dm|message)\b'
    - '\bя\s+могу\s+(?:сделать|разработать|починить|помочь)\b'
    - '\bобращайтесь\s+в\s+(?:личку|лс)\b'
    - '\bпишите\s+в\s+(?:личку|лс)\b'

  job_seeker:
    - '#(?:ищу_работу|open_to_work|looking_for_work|резюме|resume|cv)'
    - '\blooking\s+for\s+(?:work|a\s+job|a\s+position)\b'
    - '\bmy\s+(?:cv|resume)\b'
    - '\bavailability\s*:\s*(?:remote|full-time|part-time|contract)\b'
    - '\bищу\s+работу\b'
    - '\bищу\s+задач\w*\s+по\s+разработк\w*\b'
    - '\bищу\s+проект\b'
    - '\bищу\s+проект(?:ы|ов)?\b'
    - '\bменя\s+зовут\b.{0,80}\bразработчик\b'
    - '\bрезюме\b'
    - '\bготов\s+к\s+работе\b'
    - '\bopen\s+to\s+(?:work|opportunities|new\s+roles)\b'
    - '\bя\s+backend\b.{0,40}\bразработчик\b'
    - '\bищ[уу]\s+проект\b'
    - '\bavailable for web3\b'
    - '\bi(?:''m| am)\s+a\s+(?:senior|full[- ]?stack|blockchain|web3)\s+(?:developer|engineer)\b'
    - '\bi(?:''m|’m)\s+a\s+senior\s+blockchain\s+engineer\b'

  recruiter:
    - '#(?:vacancy|hiring|job|вакансия|бэкенд|frontend|backend|recruitment|aiengineer)'
    - '\b#recruitment\b'
    - '\b(?:freelance|contract)\s+opportunity\b'
    - '\b(?:gig|freelance\s+gig)\b.{0,80}\b(?:developer|engineer|programmer|quant|ml|ai)\b'
    - '\bwe\s+are\s+hiring\b'
    - '\bis\s+hiring\b'
    - '\bhiring\s+(?:an?\s+)?(?:ml\s+|ai\s+|senior\s+|junior\s+|quantitative\s+)?(?:engineer|developer|programmer|quant)\b'
    - '\b(?:vacancy|position)\b.{0,100}\b(?:developer|engineer|trader|quant|programmer|ml|ai)\b'
    - '\b(?:looking\s+for|seeking)\b.{0,100}\b(?:developer|engineer|trader|quant|programmer|ml|ai)\b'
    - '\b(?:backend|frontend|fullstack|full[- ]stack)\s+engineer\b'
    - '\bremote\s*\((?:full[- ]?time|part[- ]?time)'
    - '\bтребуется\b.{0,100}\b(?:разработчик|программист|инженер|квант|ml|ai)\b'
    - '\bищем\b.{0,100}\b(?:разработчика|программиста|инженера|кванта|ml|ai)\b'
    - '\bнужен\b.{0,40}\b(?:senior|middle|junior)\b.{0,40}\b(?:разработчик|программист|инженер|engineer)\b'
    # Russian job-ad headers only with employment co-signals (not bare "о проекте" in a buyer brief).
    - '\bо\s+проекте\b.{0,200}\b(?:о\s+компани|зп\s*:|формат\s*:|full[- ]?time|штатн)\w*'
    - '\bо\s+компани\w*\b.{0,200}\b(?:о\s+проекте|зп\s*:|формат\s*:|full[- ]?time|штатн)\w*'
    - '\bзп\s*:'
    - '\bформат\s*:\s*full'
    - '\b(?:full[- ]time|fulltime|штатн)\b.{0,80}\b(?:developer|engineer|разработчик|инженер)\b'

  platform_support:
    - '\b(?:support|api\s+team|bybit\s+team|binance\s+team|okx\s+team|please\s+clarify|please\s+check|anyone\s+know|does\s+anyone\s+know|is\s+there\s+a\s+guide|documentation)\b'
    - '\b(?:reactivat|suspend|appeal|verify|kyc|withdraw|deposit|transfer\s+funds|account\s+restricted|account\s+locked|permission\s+denied)\w*\b'
    - '\b(?:help\s+me|please\s+help|can\s+you\s+help)\b.{0,80}\b(?:account|subaccount|uid|verification|suspension|withdraw|deposit|api\s+key|permission)\b'
    - '\b(?:check\s+my\s+account|reactivate\s+my\s+account|unblock\s+my\s+account)\b'
    - '\b(?:помогите|помоги)\b.{0,100}\b(?:аккаунт|субаккаунт|верификац|блокиров|вывод|пополн|ключ|разрешен)\w*\b'
    - '\b(?:как\s+настроить|есть\s+ли\s+гайд|где\s+документация|почему\s+биржа|почему\s+bybit|почему\s+binance|пожалуйста\s+уточните)\b'

  vendor_response:
    - '\b(?:kindly|please)\s+(?:make\s+sure|check|refer\s+to)\b'
    - '\b(?:according\s+to\s+our|our\s+documentation|our\s+support|api\s+team\s+confirmed)\b'
    - '\b(?:please\s+check\s+your\s+api\s+key\s+permissions|permission\s+denied)\b'
    - '\b(?:наша\s+документация|служба\s+поддержки|проверьте\s+права|проверьте\s+api\s+ключ)\b'

