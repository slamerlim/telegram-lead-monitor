    - '\bimmediately\b'
    - '\burgently\b'
    - '\bсрочно\b'
    - '\bкак\s+можно\s+скорее\b'

# Community-specific scoring controls (BLOCKER 3).
# Classes mirror the audit taxonomy. Weights are applied by LeadScorer._profile().
