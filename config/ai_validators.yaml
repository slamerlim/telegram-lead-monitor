# Cursor-only AI validators — no third-party LLM providers.
# Model ids must match Cursor SDK allowlist (Agent.prompt Available models).
policy_version: v1
require_distinct_families: true

validators:
  - id: aival_a_claude_opus
    mode: A
    provider: cursor
    model: claude-opus-5-5
    model_family: anthropic
    prompt_version: cursor_ai_val_v1
    enabled: true
  - id: aival_b_gpt56
    mode: B
    provider: cursor
    model: gpt-5.6-sol
    model_family: openai
    prompt_version: cursor_ai_val_v1
    enabled: true
  - id: aival_c_grok47
    mode: C
    provider: cursor
    model: grok-4.7
    model_family: xai
    prompt_version: cursor_ai_val_v1
    enabled: true
  - id: aival_d_composer
    mode: D
    provider: cursor
    model: composer-2.5
    model_family: cursor
    prompt_version: cursor_ai_val_v1
    enabled: true
